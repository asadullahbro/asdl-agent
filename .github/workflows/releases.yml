name: Release Agent
on:
  push:
    branches:
      - main
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          git tag $TAG
          git push origin $TAG
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build binaries
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.Version=${{ steps.tag.outputs.tag }}" -o bin/asdl-agent-linux ./cmd/agent
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.Version=${{ steps.tag.outputs.tag }}" -o bin/asdl-agent-mac ./cmd/agent
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.Version=${{ steps.tag.outputs.tag }}" -o bin/asdl-agent-windows.exe ./cmd/agent
          cd bin && sha256sum asdl-agent-linux asdl-agent-mac asdl-agent-windows.exe > checksums.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Agent ${{ steps.tag.outputs.tag }}"
          body: |
            ## ASDL Agent ${{ steps.tag.outputs.tag }}

            ### Changes
            ${{ github.event.head_commit.message }}

            ### Download
            - asdl-agent-linux — Linux x86_64
            - asdl-agent-mac — macOS x86_64
            - asdl-agent-windows.exe — Windows x86_64

            ### Install

            Linux:
            curl -fsSL https://github.com/asadullahbro/asdl-agent/releases/latest/download/asdl-agent-linux -o /usr/local/bin/asdl-agent && chmod +x /usr/local/bin/asdl-agent

            macOS:
            curl -fsSL https://github.com/asadullahbro/asdl-agent/releases/latest/download/asdl-agent-mac -o /usr/local/bin/asdl-agent && chmod +x /usr/local/bin/asdl-agent
          files: |
            bin/asdl-agent-linux
            bin/asdl-agent-mac
            bin/asdl-agent-windows.exe
            bin/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  deploy:
    runs-on: [self-hosted, Linux, X64]
    needs: release
    steps:
      - name: Dispatch agent update to all nodes
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/api/v1/agents/deploy \
            -H "Authorization: Bearer ${{ secrets.ASDL_TOKEN }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Code: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Agent deploy dispatch failed"
            echo "$BODY"
            exit 1
          fi
          DISPATCHED=$(echo "$BODY" | jq -r '.dispatched // 0')
          TOTAL=$(echo "$BODY" | jq -r '.total // 0')
          echo "Agent update dispatched to $DISPATCHED/$TOTAL nodes"
      - name: Summary
        if: always()
        run: |
          echo "=== Release Summary ==="
          echo "Tag:     ${{ steps.tag.outputs.tag }}"
          echo "Commit:  ${{ github.sha }}"
          echo "Message: ${{ github.event.head_commit.message }}"
          echo "Time:    $(date)"