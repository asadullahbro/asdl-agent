# .github/workflows/release.yml
name: Release Agent

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o bin/asdl-agent-linux ./cmd/agent
          GOOS=darwin GOARCH=amd64 go build -o bin/asdl-agent-mac ./cmd/agent

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/asdl-agent-linux
            bin/asdl-agent-mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}